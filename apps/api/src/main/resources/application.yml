spring:
  application:
    name: api
  datasource:
    # Defaults match infra/.env.local (local development only). Override with env vars elsewhere.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/englishprep}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:12345}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
